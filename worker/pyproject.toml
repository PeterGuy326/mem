[project]
name = "mem-worker"
version = "0.1.0"
description = "mem AI Worker — Processor + Provider service (gRPC, Python 3.11+)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [
    { name = "mem contributors" },
]
keywords = ["mem", "ai", "agent", "rag", "embeddings", "grpc"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
]

dependencies = [
    # gRPC
    "grpcio>=1.83",
    "grpcio-tools>=1.83",
    "protobuf>=7.35.1",
    # Config / validation
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    # Imaging
    "pillow>=10.2",
    # PDF (placeholder — W2 actually uses)
    "pypdf>=4.0",
    # HTTP
    "requests>=2.31",
    "httpx>=0.27",
    # Cross-replica request replay protection
    "redis>=5.0",
    # Logging
    "structlog>=24.1",
    # S3 / object storage
    "boto3>=1.34",
]

[project.optional-dependencies]
clip = [
    # Phase 2: real CLIP visual embedding
    # NOTE: pinning torch to the CPU index — default PyPI wheels pull ~10GB
    # of NVIDIA CUDA shims that we never use on a typical local dev box.
    # Override the index via [tool.uv.sources] below.
    "open_clip_torch>=2.24",
    "torch>=2.2",
    "torchvision>=0.17",
]
test = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=6.0",
]
dev = [
    "ruff>=0.4",
    "mypy>=1.9",
    "types-requests",
]
face = [
    "insightface>=0.7.3",
    "numpy>=1.26",
    "onnxruntime>=1.26.0",
]
asr = [
    "faster-whisper>=1.0",
]

[project.scripts]
mem-worker = "mem_worker.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mem_worker"]

# Route torch + torchvision to the CPU-only wheel index. Saves ~10GB of NVIDIA
# CUDA shims on a typical dev box. If you actually have a GPU, override by
# setting UV_INDEX_STRATEGY=unsafe-best-match and dropping this section.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra -q"
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.coverage.run]
branch = true
relative_files = true
source = ["mem_worker"]
omit = ["mem_worker/proto/*"]

[tool.coverage.report]
show_missing = true
skip_empty = true

[tool.coverage.xml]
output = "coverage.xml"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "W"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true
