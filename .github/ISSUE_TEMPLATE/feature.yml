name: Feature request
description: Propose a user-facing capability or meaningful behavior change
title: "feat: "
labels:
  - "type:feature"
  - "status:needs-triage"
body:
  - type: markdown
    attributes:
      value: |
        Start with the problem and desired outcome. A proposed implementation is useful, but it is not a substitute for acceptance criteria.

  - type: checkboxes
    id: preflight
    attributes:
      label: Preflight
      options:
        - label: I searched open and closed issues for related proposals.
          required: true
        - label: I checked the README, specification, and roadmap for existing behavior.
          required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Who is blocked, in what context, and why does the current behavior not work?
    validations:
      required: true

  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
      description: Describe observable behavior without assuming a particular implementation.
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: List objective, testable conditions for completion.
      placeholder: |
        - [ ] Given ..., when ..., then ...
        - [ ] Existing ... remains compatible
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed approach
      description: Optional design, API, user experience, or migration notes.

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Existing workarounds and why they are insufficient.
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Primary area
      description: Choose the closest existing area; maintainers may add other applicable area labels.
      options:
        - "area:server"
        - "area:worker"
        - "area:web"
        - "area:cli"
        - "area:mcp"
        - "area:docs"
        - "area:infra"
    validations:
      required: true

  - type: dropdown
    id: evidence
    attributes:
      label: Current evidence level
      description: Choose E0–E2 based on the submitted artifacts. Maintainers assign E3 after independent reproduction and E4 after verifying the outcome.
      options:
        - "evidence:e0-unreviewed — New proposal; evidence has not been assessed"
        - "evidence:e1-report — Examples, user reports, or supporting artifacts are available"
        - "evidence:e2-source — Code, specification, or source-level evidence supports the limitation"
    validations:
      required: true

  - type: textarea
    id: risks
    attributes:
      label: Compatibility and risk
      description: Note API, data, security, privacy, performance, or migration implications.
