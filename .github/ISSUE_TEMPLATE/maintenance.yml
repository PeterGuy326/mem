name: Maintenance task
description: Propose maintenance, refactoring, testing, documentation, or infrastructure work
title: "chore: "
labels:
  - "type:maintenance"
  - "status:needs-triage"
body:
  - type: checkboxes
    id: preflight
    attributes:
      label: Preflight
      options:
        - label: I searched open and closed issues for duplicate work.
          required: true

  - type: textarea
    id: motivation
    attributes:
      label: Motivation
      description: What risk, cost, or limitation does this task address?
    validations:
      required: true

  - type: textarea
    id: scope
    attributes:
      label: Scope
      description: State what is included and explicitly excluded.
      placeholder: |
        In scope:
        - ...

        Out of scope:
        - ...
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: List objective, testable conditions for completion.
      placeholder: |
        - [ ] ...
        - [ ] ...
    validations:
      required: true

  - type: textarea
    id: validation
    attributes:
      label: Validation plan
      description: Commands, checks, or review evidence that will prove completion.
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Primary area
      description: Choose the closest existing area; maintainers may add other applicable area labels.
      options:
        - "area:server"
        - "area:worker"
        - "area:web"
        - "area:cli"
        - "area:mcp"
        - "area:docs"
        - "area:infra"
    validations:
      required: true

  - type: dropdown
    id: evidence
    attributes:
      label: Current evidence level
      description: Choose E0–E2 based on the submitted artifacts. Maintainers assign E3 after independent reproduction and E4 after verifying the outcome.
      options:
        - "evidence:e0-unreviewed — New task; evidence has not been assessed"
        - "evidence:e1-report — Rationale and supporting artifacts are available"
        - "evidence:e2-source — Code, configuration, or source-level evidence supports the task"
    validations:
      required: true

  - type: textarea
    id: dependencies
    attributes:
      label: Dependencies and risks
      description: Link blockers, dependent issues, rollout concerns, and rollback needs.
