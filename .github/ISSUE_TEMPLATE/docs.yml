name: Documentation change
description: Report missing, incorrect, or unclear documentation
title: "docs: "
labels:
  - "type:docs"
  - "status:needs-triage"
  - "area:docs"
body:
  - type: checkboxes
    id: preflight
    attributes:
      label: Preflight
      options:
        - label: I searched open and closed issues for duplicate documentation work.
          required: true

  - type: input
    id: location
    attributes:
      label: Documentation location
      description: Link the affected page, file, heading, command help, or API surface.
      placeholder: README.md#quick-start
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is missing, incorrect, outdated, or unclear, and who is affected?
    validations:
      required: true

  - type: textarea
    id: proposed
    attributes:
      label: Proposed change
      description: Describe the intended correction or outcome.
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: List objective checks for the updated documentation.
      placeholder: |
        - [ ] Commands match the current interface
        - [ ] Links and examples are verified
    validations:
      required: true

  - type: dropdown
    id: evidence
    attributes:
      label: Current evidence level
      description: Choose E0–E2 based on the submitted artifacts. Maintainers assign E3 after independent reproduction and E4 after verifying the resolution.
      options:
        - "evidence:e0-unreviewed — New report; evidence has not been assessed"
        - "evidence:e1-report — A clear documentation gap or error is reported"
        - "evidence:e2-source — Source, code, or specification confirms the correct behavior"
    validations:
      required: true
