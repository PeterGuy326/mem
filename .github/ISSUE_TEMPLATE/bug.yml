name: Bug report
description: Report a reproducible defect or regression
title: "bug: "
labels:
  - "type:bug"
  - "status:needs-triage"
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve mem. Search existing issues first.
        **Do not disclose vulnerabilities here.** Use the private reporting path in SECURITY.md.

  - type: checkboxes
    id: preflight
    attributes:
      label: Preflight
      options:
        - label: I searched open and closed issues for duplicates.
          required: true
        - label: I removed credentials, personal data, and private content from this report.
          required: true
        - label: This is not a security vulnerability.
          required: true

  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: Describe the observed defect in one or two sentences.
      placeholder: When ..., mem ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What should have happened?
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Provide the smallest deterministic sequence, including inputs.
      placeholder: |
        1. Start ...
        2. Run ...
        3. Observe ...
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior and evidence
      description: Include sanitized logs, screenshots, traces, or a minimal repository.
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: v0.1.0 or a1b2c3d
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, architecture, runtime versions, deployment mode, and relevant configuration.
      placeholder: macOS 15 / arm64; Go ...; Python ...; Node ...; Docker ...
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Primary area
      description: Choose the closest existing area; maintainers may add other applicable area labels.
      options:
        - "area:server"
        - "area:worker"
        - "area:web"
        - "area:cli"
        - "area:mcp"
        - "area:docs"
        - "area:infra"
    validations:
      required: true

  - type: dropdown
    id: severity
    attributes:
      label: Proposed severity
      description: Maintainers make the final classification.
      options:
        - "severity:s0-critical — Catastrophic impact, widespread outage, or severe data loss"
        - "severity:s1-high — Major capability unusable or broad impact with no practical workaround"
        - "severity:s2-medium — Meaningful but limited impact, or a workaround exists"
        - "severity:s3-low — Minor, cosmetic, or narrow impact"
    validations:
      required: true

  - type: dropdown
    id: evidence
    attributes:
      label: Current evidence level
      description: Choose E0–E2 based on the submitted artifacts. Maintainers assign E3 after independent reproduction and E4 after verifying the resolution.
      options:
        - "evidence:e0-unreviewed — New intake; evidence has not been assessed"
        - "evidence:e1-report — A clear report and supporting artifacts are available"
        - "evidence:e2-source — Source-level evidence identifies the relevant path or likely cause"
    validations:
      required: true

  - type: textarea
    id: regression
    attributes:
      label: Regression information
      description: If this worked before, provide the last known good version and first known bad version.

  - type: textarea
    id: additional
    attributes:
      label: Additional context
      description: Add links or sanitized details that do not fit above.
