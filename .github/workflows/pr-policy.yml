name: PR Policy

on:
  pull_request:
    types:
      - opened
      - edited
      - synchronize
      - reopened
      - ready_for_review

permissions:
  contents: read
  pull-requests: read

jobs:
  policy:
    name: Conventional title and linked issue
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Validate pull request metadata
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const pullRequest = context.payload.pull_request;
            const title = pullRequest.title.trim();
            const body = pullRequest.body || "";

            const conventionalTitle =
              /^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([a-z0-9][a-z0-9._/-]*\))?!?: .+$/;
            const linkedIssue =
              /\b(?:Closes|Fixes|Resolves|Refs)\s+(?:(?:[\w.-]+\/[\w.-]+)?#\d+|https:\/\/github\.com\/[\w.-]+\/[\w.-]+\/issues\/\d+)\b/i;

            const errors = [];
            if (!conventionalTitle.test(title)) {
              errors.push(
                "Use a Conventional Commit title, for example " +
                "`feat(memory): add scoped recall` or `fix!: reject an unsafe migration`."
              );
            }
            if (!linkedIssue.test(body)) {
              errors.push(
                "Link an issue with an explicit keyword in the PR body, for example " +
                "`Fixes #123`, `Refs owner/repository#123`, or " +
                "`Closes https://github.com/owner/repository/issues/123`."
              );
            }

            if (errors.length > 0) {
              core.setFailed(errors.join("\n"));
            } else {
              core.info("PR title and issue reference satisfy repository policy.");
            }
